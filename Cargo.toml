[package]
name = "nether-voicebridge"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "voice"] }
songbird = { version = "0.6.0", features = ["serenity"] }
async-trait = "0.1"
matrix-sdk = { version = "0.18.0", default-features = false }
