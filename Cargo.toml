[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/audio",
    "crates/discord",
    "crates/matrix-rtc",
    "crates/bridge",
    "crates/e2e",
]
# Plain `cargo build` (and the Dockerfile) still builds exactly the shipping
# five — the #38 e2e harness is opt-in via `-p nvb-e2e` (or `--workspace`).
default-members = [
    "crates/config",
    "crates/audio",
    "crates/discord",
    "crates/matrix-rtc",
    "crates/bridge",
]

# Shared package metadata. Every crate inherits these with `<field>.workspace =
# true`, so a release version bump is a single edit here. License is AGPL-3.0
# (matches the Matrix bridge ecosystem — mautrix, Synapse, Element); all
# dependencies (Apache-2.0 / MIT / ISC) are compatible.
[workspace.package]
version = "0.3.0-alpha.23"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://nether.codes/dark/nether-voicebridge"
homepage = "https://nether.codes/dark/nether-voicebridge"

# Strip symbols from release builds. The binary statically links libwebrtc and is
# huge with symbols (the debug build is ~900 MB); stripping cuts it several-fold so
# the Docker image layer fits under the registry's upload limit (Cloudflare's ~100 MB
# body cap in front of nether.codes) and deploys stay lean. Symbols only — no
# behavior change.
[profile.release]
strip = true

# Shared dependency versions. The pinned, version-sensitive crates (songbird for
# DAVE, livekit for E2EE/frame crypto — see CLAUDE.md constraint #7) live here so
# every member resolves the exact same release. Per-crate manifests reference
# these with `{ workspace = true }` and add only the features they need.
#
# matrix-sdk: `e2e-encryption` enables Olm so the bridge can decrypt the
# Olm-encrypted media keys Element Call / Commet distribute in an ENCRYPTED room
# (needed only for `media_e2ee = true` bridges; harmless for the others, where
# the room is unencrypted and no Olm peers exist). `bundled-sqlite` provides the
# persistent crypto store (`.sqlite_store`) and a hermetic build (no system
# libsqlite3). The store is wired only when `media_e2ee` is set — see
# `crates/matrix-rtc/src/matrix.rs`. `experimental-send-custom-to-device` exposes
# `Encryption::encrypt_and_send_raw_to_device` — the single SDK call ghosts use to
# Olm-encrypt their media key per recipient device (Path 3, `key_transport = "olm"`);
# it is the same API the SDK's own Element Call widget driver uses.
#
# matrix-sdk-crypto is pulled in transitively by matrix-sdk's `e2e-encryption`; we
# name it directly ONLY to reference `CollectStrategy` (the device-selection policy
# argument to `encrypt_and_send_raw_to_device`), which matrix-sdk does not re-export.
# Pinned to the exact version matrix-sdk 0.18 resolves so the two never diverge.
[workspace.dependencies]
tokio = { version = "1" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Read-modify-write of tenants.toml (#4): toml_edit preserves comments and
# operator hand-formatting where a serde round-trip would destroy them. Same
# 0.22 line toml 0.8 already pulls in transitively.
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
# `builder` powers the `/bridge approve` slash-command registration + responses
# (#47 two-sided link auth).
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "voice", "builder"] }
songbird = { version = "0.6.0", features = ["serenity", "receive"] }
hound = "3"
async-trait = "0.1"
matrix-sdk = { version = "0.18.0", default-features = false, features = ["e2e-encryption", "bundled-sqlite", "experimental-send-custom-to-device"] }
matrix-sdk-crypto = { version = "0.18.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
livekit = { version = "0.7.34", default-features = false, features = ["tokio", "rustls-tls-native-roots"] }
base64 = "0.22"
rand = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false }
# Unix signals for the e2e harness's bridge-under-test control (SIGHUP reload,
# SIGTERM drain) — already in the tree transitively via tokio/serenity.
libc = "0.2"
# Enables symphonia's PCM (f32) decoder in the SAME symphonia crate songbird
# compiles (Cargo feature unification). Without it, songbird's RawAdapter live-PCM
# path fails to promote ("no compatible track found"). Matches songbird 0.6's
# symphonia 0.5.x.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }

# Internal crates.
nvb-config = { path = "crates/config" }
nvb-audio = { path = "crates/audio" }
nvb-discord = { path = "crates/discord" }
nvb-matrix-rtc = { path = "crates/matrix-rtc" }

# songbird 0.6.0 + the DAVE-supplemental-trailer decode fix (#36): upstream
# feeds the 12-16 trailing non-audio bytes of every DAVE-decrypted packet to
# the opus decoder, silently corrupting CELT/hybrid frames ("robotic"
# speakers). Vendored + patched until fixed upstream (no songbird release
# past 0.6.0 exists yet). Patch: StoredPacket carries the corrected payload
# tail so the decode slice excludes the DAVE trailer (udp_rx/{mod,
# playout_buffer,ssrc_state}.rs).
[patch.crates-io]
songbird = { path = "vendor/songbird" }
