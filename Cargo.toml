[package]
name = "nether-voicebridge"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "voice"] }
songbird = { version = "0.6.0", features = ["serenity", "receive"] }
hound = "3"
async-trait = "0.1"
matrix-sdk = { version = "0.18.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
livekit = { version = "0.7.34", default-features = false, features = ["tokio", "rustls-tls-native-roots"] }
base64 = "0.22"
rand = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
# StreamExt for draining LiveKit's NativeAudioStream on the Matrix → Discord path.
futures-util = { version = "0.3", default-features = false }
# Enables symphonia's PCM (f32) decoder in the SAME symphonia crate songbird
# compiles (via Cargo feature unification). songbird depends on symphonia with
# default-features = false and registers no codecs, so its RawAdapter live-PCM
# path fails to promote ("no compatible track found") without this. Pinned to
# match songbird 0.6's symphonia 0.5.x.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
