# Nether Voice Bridge — example configuration
# Copy to config.toml and fill in real values. NEVER commit config.toml.
# Override the config path at runtime: CONFIG_PATH=/path/to/config.toml
#
# Config is a list of bridges. Each `[[bridge]]` block is ONE Discord voice
# channel bridged to ONE Matrix/Element Call room, running as a fully independent
# pipeline (its own Discord + Matrix clients, tokens, room, and audio). To bridge
# more channel-pairs from a single process, add more `[[bridge]]` blocks (a second
# one is shown, commented out, at the bottom).
#
# Within a bridge, all fields are required to parse. You can leave later-phase
# fields as placeholders until you reach that phase:
#   Phases 1+  : [bridge.matrix] homeserver_url, room_id, bot_user_id, access_token
#   Phases 2–3 : [bridge.discord] guild_id, channel_id
#   Phase 4+   : [bridge.livekit] media_e2ee (URLs are auto-derived)
#   Phase 7    : [bridge.discord] puppet_tokens (real values)
#   Phase 8    : [bridge.matrix] appservice_id, appservice_token
#
# IMPORTANT: each bridge needs its OWN matrix.store_path. Two matrix-sdk clients
# sharing one store will lock/corrupt; startup validation rejects duplicates.

[[bridge]]
# Optional label, used in logs/spans (the `bridge{name=...}` span prefix).
name = "test"

[bridge.discord]
# Right-click the server icon → "Copy Server ID"
# (Enable Developer Mode first: User Settings → Advanced → Developer Mode)
guild_id = "1234567890123456789"

# Right-click the target voice channel → "Copy Channel ID"
channel_id = "9876543210987654321"

# One entry per puppet bot — each is a SEPARATE Discord application with its own
# bot token, created deliberately at discord.com/developers/applications.
# Pool size = max number of simultaneous Matrix speakers attributable on Discord.
# There is NO dedicated listener bot: one puppet is auto-elected as the floating
# capture "anchor" for Discord→Matrix audio. If you previously ran a separate
# listener bot, just add its token to this list (and optionally rename that bot
# in the Discord dev portal — a manual step). Each puppet must be invited to the
# guild with: Connect, Speak, Use Voice Activity, Change Nickname. Store raw
# tokens (no "Bot " prefix).
puppet_tokens = [
    "YOUR_PUPPET_BOT_TOKEN_1",
    "YOUR_PUPPET_BOT_TOKEN_2",
]

# Optional (default false). When true, also write per-SSRC capture_<ssrc>.wav
# files (the Phase 3 debugging artifact) alongside forwarding audio to Matrix.
# Leave off in normal use — it writes unbounded files. Handy to A/B a fault:
# if the WAV has audio but Element Call is silent, the problem is downstream of
# capture. NOTE: filenames are not bridge-prefixed, so don't enable on two
# bridges that might see the same SSRC at once.
capture_wav = false

# Optional (default "[Matrix] "). Prefix prepended to puppet bot nicknames so
# Discord users can tell which voices are bridged Matrix participants. Set to
# "" to disable. Prefix + name is truncated to Discord's 32-char nickname cap.
nickname_prefix = "[Matrix] "

[bridge.matrix]
# Fixed: your Tuwunel homeserver.
homeserver_url = "https://nether.im"

# Internal room ID — NOT the #alias form.
# Element: open the room → Settings → Advanced → "Internal room ID" (!abc:nether.im)
room_id = "!yourroomid:nether.im"

# MXID of the bridge bot account you created on nether.im.
bot_user_id = "@voicebridge:nether.im"

# Device ID associated with the access token below.
# To find it: Element (logged in as the bot) → Settings → Help & About → "Session ID",
# or call GET /_matrix/client/v3/account/whoami (returns { device_id: "..." }).
# Must match the token — matrix-sdk uses this to restore the session correctly.
device_id = "ABCDEFGHIJ"

# Access token for the bot account.
# Element (logged in as the bot): Settings → Help & About → Access Token
# Or via the Matrix /_matrix/client/v3/login API.
access_token = "syt_your_access_token_here"

# These two fields come from the appservice registration YAML you install on
# Tuwunel. They are only needed starting in Phase 8 (Discord→Matrix ghosts).
# The id is whatever name you chose when registering the appservice;
# the appservice_token is the as_token from that registration file.
appservice_id = "voicebridge"
appservice_token = "your_appservice_hs_token_here"

# matrix-sdk store (Olm crypto + state). MUST be unique per bridge.
store_path = "./nether-store/general"

[bridge.livekit]
# The lk-jwt-service endpoint and the LiveKit SFU WebSocket URL are BOTH
# auto-derived at runtime — the bridge reads the homeserver's
# `.well-known/matrix/client` (MSC4143 `rtc_foci`) for the lk-jwt endpoint and
# takes the SFU ws URL from the lk-jwt response. You normally need NEITHER of
# the two fields below. Uncomment one only to override the derived value (e.g. a
# homeserver without `rtc_foci`, or a non-Nether deploy):
#   lk_jwt_url = "https://lk-jwt.nether.im"   # override lk-jwt-service endpoint
#   url        = "wss://livekit.nether.im"    # override SFU WebSocket URL

# Element Call media frame E2EE (AES-GCM, HKDF). Leave FALSE unless the EC
# deployment actually runs per-frame encryption (typically only for ENCRYPTED
# Matrix rooms). nether.im's room is unencrypted and EC runs the call without
# media E2EE, so the bridge must NOT encrypt — encrypting into a non-E2EE call
# makes peers hear the bridge's ciphertext as static. Default: false.
media_e2ee = false

# ─── A second bridge (different channel ↔ different room) ────────────────────
# Uncomment and fill in to bridge a second pair from this same process. Note the
# distinct `name` and `store_path`, and its own full set of Discord bot tokens.
#
# [[bridge]]
# name = "gaming"
#
# [bridge.discord]
# guild_id = "1234567890123456789"
# channel_id = "1111111111111111111"
# puppet_tokens = ["YOUR_SECOND_PUPPET_1", "YOUR_SECOND_PUPPET_2"]
# capture_wav = false
#
# [bridge.matrix]
# homeserver_url = "https://nether.im"
# room_id = "!anotherroomid:nether.im"
# bot_user_id = "@voicebridge:nether.im"
# device_id = "ABCDEFGHIJ"
# access_token = "syt_your_access_token_here"
# appservice_id = "voicebridge"
# appservice_token = "your_appservice_hs_token_here"
# store_path = "./nether-store/gaming"   # MUST differ from the first bridge
#
# [bridge.livekit]
# media_e2ee = false
# # lk_jwt_url / url are auto-derived; uncomment only to override (see above).
