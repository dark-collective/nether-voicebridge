# Nether Voice Bridge — example configuration
# Copy to config.toml and fill in real values. NEVER commit config.toml.
# Override the config path at runtime: CONFIG_PATH=/path/to/config.toml
#
# Single-bridge deployments can skip this file entirely and use NETHER_* environment
# variables instead — see docs/docker-usage.md for the full variable reference.
#
# Two top-level pieces:
#   [puppets]  — ONE shared pool of Discord bot tokens, used by ALL bridges. Bots
#                are allocated to channels dynamically as people speak.
#   [[bridge]] — each block bridges ONE Discord voice channel ↔ ONE Matrix/
#                Element Call room. Add more `[[bridge]]` blocks to bridge more
#                channel-pairs from a single process; they share the puppet pool.
#
# How the shared pool works: each active channel reserves ONE bot as its capture
# "anchor" (enough to bridge the channel by itself — it captures all Discord
# speakers and plays a blended mix of all Matrix speakers). Extra bots become
# dedicated, individually-named/mutable puppets for individual Matrix speakers.
# When a brand-new channel needs an anchor and no bot is free, a spare bot is
# moved from a channel that has slack; if none do, that channel waits (logged).
#
# Each bridge needs its OWN matrix.store_path. You normally DON'T set it: when
# omitted, it is auto-derived as `<data_dir>/<bridge-name>` (a distinct path per
# bridge). Set `matrix.store_path` only to override that. Two bridges sharing a
# store will lock/corrupt; startup validation rejects duplicates.

# Base directory for auto-derived store paths. Default "./nether-store".
# Overridden at runtime by the NVB_DATA_DIR env var (the Docker image sets it to
# /app/data so stores persist on the container's volume with no config change).
# data_dir = "./nether-store"

# ── Runtime-provisioned bridges (tenants) ────────────────────────────────────
# Besides the static [[bridge]] blocks below, bridges can be added/removed at
# RUNTIME via `<data_dir>/tenants.toml` — same [[bridge]] schema, with two rules:
#   * every entry MUST set an explicit `name` (it keys the running bridge), and
#   * no [server.*]/[puppets] blocks there — `server = "…"` references resolve
#     against THIS file's profiles.
# Reload with SIGHUP (systemd: `systemctl reload`, or `kill -HUP <pid>`): the
# running tenant set is reconciled against the file — additions start, removals
# stop cleanly, changed entries restart with the new config. A file that fails
# validation is rejected whole (loudly, in the logs); the running set is
# untouched. Static [[bridge]]s are never affected by a reload.
# Write the file atomically (write a temp file, then `mv` over tenants.toml) so
# a reload never reads a half-written file, and pre-flight your edits with:
#   nether-voicebridge --check-tenants [PATH]   # prints per-entry verdicts

# ── Server profiles (optional for static bridges, REQUIRED for management) ───
# A named [server.<name>] block holds the homeserver/appservice fields that are
# identical across bridges on one homeserver; a bridge (or tenants.toml entry)
# sets `server = "<name>"` + its own room_id and inherits the rest. The
# management bot below and every bot-`link`ed tenant resolve against these.
#
# [server.nether]
# homeserver_url = "https://nether.im"
# sender_localpart = "nether-voicebridge"
# appservice_id = "voicebridge"
# appservice_token = "your_appservice_hs_token_here"

# ── Management bot (optional) ────────────────────────────────────────────────
# A Matrix bot that lets the operators listed in `allow` manage the tenant
# bridges over DM instead of editing tenants.toml by hand. Invite the bot user
# (the same appservice bot the bridges use, e.g. @nether-voicebridge_bot:…) to
# a room/DM — it only accepts invites from allowlisted MXIDs — and send `help`.
# Commands: `list`, `link <name> <room-id> <guild-id> <channel-id> [server]`,
# `unlink <name>`. Every change is written to tenants.toml and applied through
# the same reconcile a SIGHUP runs (rolled back if rejected), so bot edits and
# hand edits never conflict. With [management] configured, a config with ZERO
# [[bridge]] blocks (and an empty tenants.toml) is valid — bridges can be
# created entirely via `link`.
#
# [management]
# server = "nether"              # [server.<name>] profile; optional with exactly one profile
# allow = ["@you:nether.im"]     # operator MXIDs (commands + invite auto-join)
# # display_name = "Voice Bridge Manager"   # optional; sets the shared bot account's name
# # device_id / store_path auto-derive ("management", <data_dir>/management)
#
# # Two-sided link auth (#47) — both optional, both default false:
# # require_room_authority = true    # `link` sender must be a joined member of the target
# #                                  # room with an EXPLICIT moderator grant (a users[] PL
# #                                  # entry above users_default and >= 50), re-checked at
# #                                  # approval time, not just an allowlisted operator (#86)
# # require_discord_approval = true  # `link` is held PENDING (nothing written) until someone
# #                                  # with Manage Server in the target guild runs
# #                                  # `/bridge approve code:<code>`; the command is
# #                                  # registered by the puppet bot at approval_bot_index
# #                                  # (default 0), whose application must be invited with
# #                                  # the `applications.commands` OAuth scope
# # approval_timeout_secs = 600      # pending-link TTL
# # approval_bot_index = 0           # which [puppets] token serves /bridge approve
# # approval_bot_name = "Voice Bridge"  # (#80) display name of that bot, shown in the
# #                                  # pending-code reply so a self-serve user knows which
# #                                  # Discord bot to run /bridge approve on
#
# # Open registration (#43) — default false. When true, Matrix users NOT on
# # `allow` may DM the bot (direct rooms only) and self-serve: `link` (with
# # two-sided auth mandatory — validation requires both require_* knobs on),
# # plus `unlink`/`list` scoped to bridges they created. ban/unban/bans stay
# # operator-only. Pair with [limits] max_tenants_per_owner.
# # open_registration = true
# # self_serve_allow = ["@friend:nether.im"]  # (#82) invite-only middle tier: when set,
# #                                  # only these MXIDs (plus operators) get the self-serve
# #                                  # tier; everyone else is ignored. This SEEDS
# #                                  # <data_dir>/self_serve_allow.toml once (if absent);
# #                                  # thereafter edit it live over DM with
# #                                  # serve-allow/serve-remove/serve-open. Absent ⇒ open to
# #                                  # every Matrix user (the default).
# # privacy_policy_url = "https://example.org/privacy"  # appended to link/approve
# #                                  # disclosure texts (also link it in each Discord
# #                                  # app's Developer-Portal privacy-policy field)
# # docs_url = "https://example.org/bridge-guide"  # (#92) user-guide URL appended to
# #                                  # the DM greeting, `help`, the pending-approval
# #                                  # reply, and the errors the guide explains (IDs,
# #                                  # power levels) — gives cold DMers a way in
# # instance_notice = "Open beta — best-effort uptime. Help: #help:example.org"
# #                                  # (#94) free-text notice appended to the DM
# #                                  # greeting and `help` — beta disclaimer etc.

# ── Companion interface (optional) ───────────────────────────────────────────
# Companion interface (off by default): an HTTP listener at /_nvb/v1 through
# which companion tools, holding a key issued in the management DM
# (`companion key create …`), get time-bounded leases. This release serves the
# `observe` lease: a server-sent-events stream of the room's represented Discord
# members (ghost, display name, Discord's streaming flag), whether the call is
# active and its listener count. The listener speaks plain HTTP — put it behind
# your TLS reverse proxy and route /_nvb/ to it.
# [companions]
# enabled = true
# listen = "127.0.0.1:8787"
# max_lease_hours = 6           # a lease not renewed within this ends
# sse_grace_secs = 30           # a lease without its event stream ends after this
# sse_keepalive_secs = 25       # keep-alive comments (proxies cut quiet streams at ~100 s)
# max_leases_per_key = 4
# lease_requests_per_minute = 10
# auth_failures_per_minute = 20 # per client address, then 429
# client_ip_header = "CF-Connecting-IP"   # only when every request comes through that proxy
# Your own call data for your own tools (ADR 0005): a device of a member's own account
# enrolls once with an OpenID token and then gets only that member's own media key and call state.
# public_url = "https://bridge.example.org"   # advertised in each bridged room (unset = not advertised)
# self_enroll = true                          # serve /_nvb/v1/self/*
# enrollments_per_minute = 5                  # per client address, checked before any verification
# trusted_private_servers = []                # homeservers allowed to resolve to private addresses

# ── Admission limits (optional) ──────────────────────────────────────────────
# Hard caps for a hosted deployment (#47). Every field is optional; an absent
# field (or the whole absent section) means unlimited — the default behavior.
#
# [limits]
# max_tenants = 25              # tenant bridges admitted (static [[bridge]]s don't count);
#                               # boot / SIGHUP / `link` reject a set beyond this
# max_ghosts_per_bridge = 16    # concurrent bridged Discord speakers per bridge; at the cap
#                               # a NEW speaker is not bridged (WARN) until a slot frees
# mgmt_cooldown_secs = 30       # per-sender cooldown between `link`/`unlink` commands (operators exempt)
# max_tenants_per_owner = 2     # bridges one self-serve user may own at once (#43;
#                               # counts pending approvals too; operators exempt)
# max_tenants_per_guild = 3     # bridges that may target one Discord guild (#77 anti-Sybil;
#                               # the Manage-Server gate is harder to Sybil than a federated
#                               # MXID, so cap by guild; counts pending; operators exempt)
# max_link_attempts = 5         # self-serve `link` attempts per window (#77 velocity limit,
#                               # atop mgmt_cooldown_secs; operators exempt)
# link_attempt_window_secs = 3600  # window for max_link_attempts (default 1 h if omitted)
# max_global_link_attempts = 30 # GLOBAL (all-senders) cap on `link`-probe + invite auto-join
#                               # attempts per window (#84). NOT keyed on the MXID, so a
#                               # federated Sybil swarm can't dodge the per-owner budgets by
#                               # rotating throwaway accounts. Operators exempt. REQUIRED when
#                               # open_registration is on.
# global_link_window_secs = 60  # window for max_global_link_attempts (default 60 s if omitted)

# ── Timing (test harness only — leave unset in production) ──────────────────
# Grace-timer profile (#38). Defaults are the production values; the automated
# test harness compresses them so lifecycle scenarios run in seconds. Setting
# ANY key (or NVB_TIMING=compressed in the environment; explicit keys below
# override the preset) logs a loud startup warning. All values in milliseconds
# and must be > 0.
#
# [timing]
# leave_grace_ms = 12000        # membership-leave debounce before puppet release
# reap_grace_ms = 45000         # phantom m.call.member absence before the reaper empties it
# reap_interval_ms = 20000      # reaper sweep cadence while a call is active
# anchor_idle_grace_ms = 90000  # capture-only anchor linger before leaving voice
# quarantine_base_ms = 15000    # base voice-join-failure backoff (doubles per failure)
# quarantine_max_ms = 120000    # cap on that backoff
# voice_health_sweep_ms = 15000 # silent-voice-death probe cadence
# session_rotate_min_interval_ms = 90000  # min spacing between ghost Olm session rotations (#52)
# paired_leave_grace_ms = 30000  # a paired member's Discord session may drop and return this long before the puppet fallback + notice (ADR 0001)
# paired_arrival_grace_ms = 30000  # a paired member joining the call without their Discord half only listens (standby anchor) this long before getting a puppet; speaking ends it early (ADR 0003)
# paired_departure_grace_ms = 5000  # a paired member whose Discord half leaves stays listen-only this long (and while their own leave is pending) before getting a puppet; speaking ends it early (ADR 0005)

[puppets]
# One entry per puppet bot — each is a SEPARATE Discord application with its own
# bot token, created deliberately at discord.com/developers/applications. This is
# the WHOLE pool, shared across every [[bridge]]. Pool size = max number of
# simultaneous dedicated Matrix speakers across all channels at once (plus one
# anchor reserved per active channel). Allocation is guild-aware: a bot is only
# used for a channel in a guild it has been invited to (with Connect, Speak, Use
# Voice Activity, Change Nickname). Invite a bot to EVERY guild you want it to be
# usable in — to share elastically across guilds, invite all bots to all guilds;
# to partition, invite some bots to one guild and others to another. Store raw
# tokens (no "Bot " prefix). Do NOT list a token twice.
tokens = [
    "YOUR_PUPPET_BOT_TOKEN_1",
    "YOUR_PUPPET_BOT_TOKEN_2",
]

# Optional (default "[Matrix] "). Prefix prepended to puppet bot nicknames so
# Discord users can tell which voices are bridged Matrix participants. Set to
# "" to disable. Prefix + name is truncated to Discord's 32-char nickname cap.
nickname_prefix = "[Matrix] "
# Optional (default "[Matrix: Standby]"). WHOLE nickname (prefix NOT applied) a
# bot wears while idling in a channel during the brief post-call grace window,
# so it doesn't look like a participant named after the bare prefix.
# standby_nickname = "[Matrix: Standby]"

[[bridge]]
# Optional label, used in logs/spans (the `bridge{name=...}` span prefix).
name = "test"

[bridge.discord]
# Right-click the server icon → "Copy Server ID"
# (Enable Developer Mode first: User Settings → Advanced → Developer Mode)
guild_id = "1234567890123456789"

# Right-click the target voice channel → "Copy Channel ID"
channel_id = "9876543210987654321"

# Optional (default false). When true, also write per-SSRC capture_<ssrc>.wav
# files (the Phase 3 debugging artifact) alongside forwarding audio to Matrix.
# Leave off in normal use — it writes unbounded files. Handy to A/B a fault:
# if the WAV has audio but Element Call is silent, the problem is downstream of
# capture. NOTE: filenames are not bridge-prefixed, so don't enable on two
# bridges that might see the same SSRC at once.
capture_wav = false

[bridge.matrix]
# Fixed: your Tuwunel homeserver.
homeserver_url = "https://nether.im"

# Matrix domain (e.g. "nether.im"). OPTIONAL — when omitted, it is extracted
# from homeserver_url (hostname after stripping the scheme). Only needed when
# homeserver_url is an internal proxy address that differs from the public
# Matrix domain, which is typical in Docker/Ansible deployments where
# homeserver_url might be "http://matrix-traefik:8008".
# matrix_domain = "nether.im"

# Internal room ID — NOT the #alias form.
# Element: open the room → Settings → Advanced → "Internal room ID" (!abc:nether.im)
#
# ROOM REQUIREMENT: the room must allow power level 0 to send the call-membership
# state event `org.matrix.msc3401.call.member` (the standard Element Call setup) —
# otherwise the bridge's ghosts (and the E2EE subscriber) can't post their call
# membership and won't appear in the call (Discord→Matrix audio fails with a 403
# "not enough power for org.matrix.msc3401.call.member"). Starting/joining a proper
# Element Call in the room configures this; or set it via Element /devtools →
# room state → m.room.power_levels → events["org.matrix.msc3401.call.member"] = 0.
# NOTE: Element's friendly "Roles & Permissions → Join Element calls" shows
# "Default" both when it's unset (falls through to state_default=50) AND when it's
# an explicit 0 — so it's unreliable. Verify the RAW m.room.power_levels via
# /devtools, not that label.
room_id = "!yourroomid:nether.im"

# The bridge bot's identity. `sender_localpart` is the STEM of the appservice user
# namespace (it must equal the stem of the registration's `namespaces.users` regex,
# e.g. regex `@nether-voicebridge_.*` -> sender_localpart = "nether-voicebridge").
# It drives BOTH:
#   * the per-speaker ghost MXIDs: `@{sender_localpart}_{discord_user_id}:server`
#   * the bot MXID, when `bot_user_id` is not set: `@{sender_localpart}_bot:server`
# Note the `_bot` suffix: the bare `@{sender_localpart}` user is the appservice's
# sender, which Synapse blocks from all sync endpoints — so the bot rides a normal
# `_bot`-suffixed namespace user instead.
#
# Provide `sender_localpart` (recommended), or pin an explicit `bot_user_id` (which
# always wins and skips the `_bot` derivation). An explicit bot must still be in the
# AS namespace OR be the registration's own sender user. Do NOT set sender_localpart
# to the registration's `sender_localpart` (e.g. "voicebridge_as") — that would put
# ghosts outside the namespace.
sender_localpart = "nether-voicebridge"
# bot_user_id = "@voicebridge_as:nether.im"   # explicit override (e.g. the AS sender user)

# Device ID for the bot's matrix-sdk session. A stable id asserted via appservice
# login — keep it fixed so the persistent crypto store stays valid across restarts.
# Optional: when omitted, it auto-derives from the bridge name.
device_id = "ABCDEFGHIJ"

# These two fields come from the appservice registration YAML you install on
# Tuwunel. The appservice_token is the as_token used to authenticate and
# masquerade. The id is whatever name you chose when registering the appservice.
appservice_id = "voicebridge"
appservice_token = "your_appservice_hs_token_here"

# matrix-sdk store (Olm crypto + state). OPTIONAL — omit to auto-derive
# `<data_dir>/<bridge-name>` (here: ./nether-store/general). Set it only to
# override the location. Must be unique per bridge (validation enforces this).
# store_path = "./nether-store/general"

# Bridge-bot identity in the Element Call roster (the subscriber is a visible
# member only when media_e2ee = true). Both OPTIONAL — without them the project
# default name "Nether Voice Bridge" and the committed default avatar are used.
# bot_display_name = "Nether Voice Bridge"
# bot_avatar_path  = "/path/to/your/avatar.png"   # uploaded once; persists as mxc://

# Device hygiene (#53). OPTIONAL, defaults to on. At startup the bridge deletes
# from the homeserver the device ids this store itself RETIRED (re-minted away
# from) — and only those, so devices belonging to another deployment (a dev box
# vs a VPS) are structurally safe. Also settable once in the [server.<name>]
# profile. Set false to keep retired devices on the homeserver.
# prune_stale_devices = true

[bridge.livekit]
# The lk-jwt-service endpoint and the LiveKit SFU WebSocket URL are BOTH
# auto-derived at runtime — the bridge reads the homeserver's
# `.well-known/matrix/client` (MSC4143 `rtc_foci`) for the lk-jwt endpoint and
# takes the SFU ws URL from the lk-jwt response. You normally need NEITHER of
# the two fields below. Uncomment one only to override the derived value (e.g. a
# homeserver without `rtc_foci`, or a non-Nether deploy):
#   lk_jwt_url = "https://lk-jwt.nether.im"   # override lk-jwt-service endpoint
#   url        = "wss://livekit.nether.im"    # override SFU WebSocket URL

# Element Call media frame E2EE (AES-GCM, HKDF). OPTIONAL — by default this is
# AUTO-DETECTED from the room's `m.room.encryption` state at startup: an encrypted
# room ⇒ on, an unencrypted room ⇒ off. (Encryption is a one-way latch, so the
# detected value is stable.) Getting it right matters — encrypting into a non-E2EE
# call makes peers hear static, and not encrypting into an E2EE call means they
# can't decrypt — which is exactly why auto-detect is the default. When it resolves
# on, the bridge does Olm via a persistent crypto store and posts m.call.member to
# receive media keys via a clean, self-provisioned appservice device identity.
# Works BOTH directions. Set this only to
# FORCE a value (e.g. media_e2ee = false to keep a bridge plaintext in an encrypted
# room); leave it commented to auto-detect.
# media_e2ee = false

# How ghost media keys reach the call's humans (only when media E2EE resolves on).
# OPTIONAL — auto-selected from the resolved media_e2ee: an encrypted room defaults
# to "olm", otherwise "plaintext". Set this only to pin a transport.
#   "plaintext" — an unencrypted to-device key send. The homeserver can read the
#     key; fine where EC has no media-E2EE security model.
#   "olm" — true end-to-end: each ghost becomes a full crypto client (its own
#     device + a persistent store nested under matrix.store_path) and Olm-encrypts
#     its key per recipient device, so the homeserver never sees the frame key.
#     Heavier (one sync per active Discord speaker) — see the architecture doc.
# key_transport = "olm"

# ─── A second bridge (different channel ↔ different room) ────────────────────
# Uncomment and fill in to bridge a second pair from this same process. Note the
# distinct `name` and `channel_id` (`store_path` auto-derives from `name`). It
# does NOT carry its own bot tokens — it draws from the shared [puppets] pool
# above (make sure those bots are invited to this bridge's guild too).
#
# Reusing ONE Matrix account across bridges: give each bridge a DISTINCT
# `device_id` (or omit to auto-derive one from the bridge name). The appservice
# self-provisions a separate device per bridge, so the same `bot_user_id` can back
# many bridges safely. Two bridges sharing a device_id makes their crypto clients
# collide and breaks E2EE. So: same appservice user is fine, same device_id is not.
#
# [[bridge]]
# name = "gaming"
#
# [bridge.discord]
# guild_id = "1234567890123456789"
# channel_id = "1111111111111111111"
# capture_wav = false
#
# [bridge.matrix]
# homeserver_url = "https://nether.im"
# # matrix_domain = "nether.im"   # set only when homeserver_url is an internal proxy address
# room_id = "!anotherroomid:nether.im"
# sender_localpart = "nether-voicebridge"   # = the AS namespace stem; derives bot @{stem}_bot + ghosts
# # bot_user_id = "@voicebridge_as:nether.im"  # explicit override (skips _bot derivation)
# device_id = "ABCDEFGHIJ"
# appservice_id = "voicebridge"
# appservice_token = "your_appservice_hs_token_here"
# store_path = "./nether-store/gaming"   # OPTIONAL — auto-derives to <data_dir>/<name>
#
# [bridge.livekit]
# # media_e2ee / key_transport auto-detect from room encryption; set only to force.
# # lk_jwt_url / url are auto-derived; uncomment only to override (see above).
