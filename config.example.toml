# Nether Voice Bridge — example configuration
# Copy to config.toml and fill in real values. NEVER commit config.toml.
# Override the config path at runtime: CONFIG_PATH=/path/to/config.toml
#
# Two top-level pieces:
#   [puppets]  — ONE shared pool of Discord bot tokens, used by ALL bridges. Bots
#                are allocated to channels dynamically as people speak.
#   [[bridge]] — each block bridges ONE Discord voice channel ↔ ONE Matrix/
#                Element Call room. Add more `[[bridge]]` blocks to bridge more
#                channel-pairs from a single process; they share the puppet pool.
#
# How the shared pool works: each active channel reserves ONE bot as its capture
# "anchor" (enough to bridge the channel by itself — it captures all Discord
# speakers and plays a blended mix of all Matrix speakers). Extra bots become
# dedicated, individually-named/mutable puppets for individual Matrix speakers.
# When a brand-new channel needs an anchor and no bot is free, a spare bot is
# moved from a channel that has slack; if none do, that channel waits (logged).
#
# IMPORTANT: each bridge needs its OWN matrix.store_path. Two matrix-sdk clients
# sharing one store will lock/corrupt; startup validation rejects duplicates.

[puppets]
# One entry per puppet bot — each is a SEPARATE Discord application with its own
# bot token, created deliberately at discord.com/developers/applications. This is
# the WHOLE pool, shared across every [[bridge]]. Pool size = max number of
# simultaneous dedicated Matrix speakers across all channels at once (plus one
# anchor reserved per active channel). Allocation is guild-aware: a bot is only
# used for a channel in a guild it has been invited to (with Connect, Speak, Use
# Voice Activity, Change Nickname). Invite a bot to EVERY guild you want it to be
# usable in — to share elastically across guilds, invite all bots to all guilds;
# to partition, invite some bots to one guild and others to another. Store raw
# tokens (no "Bot " prefix). Do NOT list a token twice.
tokens = [
    "YOUR_PUPPET_BOT_TOKEN_1",
    "YOUR_PUPPET_BOT_TOKEN_2",
]

# Optional (default "[Matrix] "). Prefix prepended to puppet bot nicknames so
# Discord users can tell which voices are bridged Matrix participants. Set to
# "" to disable. Prefix + name is truncated to Discord's 32-char nickname cap.
nickname_prefix = "[Matrix] "

[[bridge]]
# Optional label, used in logs/spans (the `bridge{name=...}` span prefix).
name = "test"

[bridge.discord]
# Right-click the server icon → "Copy Server ID"
# (Enable Developer Mode first: User Settings → Advanced → Developer Mode)
guild_id = "1234567890123456789"

# Right-click the target voice channel → "Copy Channel ID"
channel_id = "9876543210987654321"

# Optional (default false). When true, also write per-SSRC capture_<ssrc>.wav
# files (the Phase 3 debugging artifact) alongside forwarding audio to Matrix.
# Leave off in normal use — it writes unbounded files. Handy to A/B a fault:
# if the WAV has audio but Element Call is silent, the problem is downstream of
# capture. NOTE: filenames are not bridge-prefixed, so don't enable on two
# bridges that might see the same SSRC at once.
capture_wav = false

[bridge.matrix]
# Fixed: your Tuwunel homeserver.
homeserver_url = "https://nether.im"

# Internal room ID — NOT the #alias form.
# Element: open the room → Settings → Advanced → "Internal room ID" (!abc:nether.im)
#
# ROOM REQUIREMENT: the room must allow power level 0 to send the call-membership
# state event `org.matrix.msc3401.call.member` (the standard Element Call setup) —
# otherwise the bridge's ghosts (and the E2EE subscriber) can't post their call
# membership and won't appear in the call (Discord→Matrix audio fails with a 403
# "not enough power for org.matrix.msc3401.call.member"). Starting/joining a proper
# Element Call in the room configures this; or set it via Element /devtools →
# room state → m.room.power_levels → events["org.matrix.msc3401.call.member"] = 0.
# NOTE: Element's friendly "Roles & Permissions → Join Element calls" shows
# "Default" both when it's unset (falls through to state_default=50) AND when it's
# an explicit 0 — so it's unreliable. Verify the RAW m.room.power_levels via
# /devtools, not that label.
room_id = "!yourroomid:nether.im"

# MXID of the bridge bot account you created on nether.im.
bot_user_id = "@voicebridge:nether.im"

# Device ID for the bot's matrix-sdk session. In access_token mode it must match
# the device the token was minted for (Element → Settings → Help & About →
# "Session ID", or GET /_matrix/client/v3/account/whoami). In appservice-auth
# mode (no access_token, see below) it is any STABLE id we assert via appservice
# login — keep it fixed so the persistent crypto store stays valid.
device_id = "ABCDEFGHIJ"

# Access token for the bot account. TWO modes:
#  • Provide it  → regular-account auth (Element → Settings → Help & About →
#    Access Token, or the /login API). `bot_user_id` is your real bot account.
#  • OMIT it     → appservice-auth: the bridge self-provisions a device + token
#    via m.login.application_service (no password — good for SSO homeservers, and
#    it yields a clean crypto identity). `bot_user_id` must then be an appservice
#    user (e.g. the registration's sender_localpart, "@voicebridge_as:..."),
#    invited to the room/space like any participant. Recommended for media_e2ee.
access_token = "syt_your_access_token_here"

# These two fields come from the appservice registration YAML you install on
# Tuwunel. Needed for Phase 8 ghosts AND for appservice-auth mode above (the
# appservice_token is the as_token used to mint/masquerade). The id is whatever
# name you chose when registering the appservice.
appservice_id = "voicebridge"
appservice_token = "your_appservice_hs_token_here"

# matrix-sdk store (Olm crypto + state). MUST be unique per bridge.
store_path = "./nether-store/general"

# Bridge-bot identity in the Element Call roster (the subscriber is a visible
# member only when media_e2ee = true). Both OPTIONAL — without them the project
# default name "Nether Voice Bridge" and the committed default avatar are used.
# bot_display_name = "Nether Voice Bridge"
# bot_avatar_path  = "/path/to/your/avatar.png"   # uploaded once; persists as mxc://

[bridge.livekit]
# The lk-jwt-service endpoint and the LiveKit SFU WebSocket URL are BOTH
# auto-derived at runtime — the bridge reads the homeserver's
# `.well-known/matrix/client` (MSC4143 `rtc_foci`) for the lk-jwt endpoint and
# takes the SFU ws URL from the lk-jwt response. You normally need NEITHER of
# the two fields below. Uncomment one only to override the derived value (e.g. a
# homeserver without `rtc_foci`, or a non-Nether deploy):
#   lk_jwt_url = "https://lk-jwt.nether.im"   # override lk-jwt-service endpoint
#   url        = "wss://livekit.nether.im"    # override SFU WebSocket URL

# Element Call media frame E2EE (AES-GCM, HKDF). Set TRUE for an ENCRYPTED Matrix
# room (where EC runs per-frame encryption); FALSE for an unencrypted room
# (encrypting into a non-E2EE call makes peers hear static). When true the bridge
# does Olm via a persistent crypto store and posts m.call.member to receive media
# keys — pair it with appservice-auth (omit access_token above) for a clean,
# self-provisioned device identity. Works BOTH directions (Matrix→Discord receive
# and Discord→Matrix ghost publishing). Default: false.
media_e2ee = false

# How ghost media keys reach the call's humans when media_e2ee = true (ignored
# otherwise):
#   "plaintext" (default) — an unencrypted to-device key send. The homeserver can
#     read the key; correct for an unencrypted room, where EC has no media-E2EE
#     security model anyway.
#   "olm" — true end-to-end: each ghost becomes a full crypto client (its own
#     device + a persistent store nested under matrix.store_path) and Olm-encrypts
#     its key per recipient device. Use this for a genuinely ENCRYPTED room so the
#     homeserver never sees the frame key. Heavier (one sync per active Discord
#     speaker) — see the architecture doc.
# key_transport = "plaintext"

# ─── A second bridge (different channel ↔ different room) ────────────────────
# Uncomment and fill in to bridge a second pair from this same process. Note the
# distinct `name`, `store_path`, and `channel_id`. It does NOT carry its own bot
# tokens — it draws from the shared [puppets] pool above (make sure those bots
# are invited to this bridge's guild too).
#
# [[bridge]]
# name = "gaming"
#
# [bridge.discord]
# guild_id = "1234567890123456789"
# channel_id = "1111111111111111111"
# capture_wav = false
#
# [bridge.matrix]
# homeserver_url = "https://nether.im"
# room_id = "!anotherroomid:nether.im"
# bot_user_id = "@voicebridge:nether.im"
# device_id = "ABCDEFGHIJ"
# access_token = "syt_your_access_token_here"
# appservice_id = "voicebridge"
# appservice_token = "your_appservice_hs_token_here"
# store_path = "./nether-store/gaming"   # MUST differ from the first bridge
#
# [bridge.livekit]
# media_e2ee = false
# # lk_jwt_url / url are auto-derived; uncomment only to override (see above).
