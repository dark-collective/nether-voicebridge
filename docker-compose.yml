services:
  voicebridge:
    image: nether.codes/nether/nether-voicebridge:latest
    restart: unless-stopped
    volumes:
      # Persistent matrix-sdk SQLite store (session state + Olm crypto).
      # Store paths inside the container are auto-derived as /app/data/<bridge-name>
      # via the NVB_DATA_DIR=/app/data baked into the image — no config change needed.
      - voicebridge-data:/app/data
      # CONFIG FILE MODE (multi-bridge or preference): uncomment to mount a
      # config.toml. When the file is present it takes priority over env vars;
      # when absent the bridge reads NETHER_* vars below (single-bridge only).
      # Copy config.example.toml → config.toml, fill in values, never commit it.
      # - ./config.toml:/app/config.toml:ro
    environment:
      # Log filter. Raise to "debug" for a specific crate when diagnosing issues.
      # e.g. "nvb_discord=debug,nvb_matrix_rtc=debug,info"
      RUST_LOG: "nether_voicebridge=debug,info"

      # When config.toml is not mounted above, the bridge reads from these vars.
      # When in this mode, the bridge supports only a single bridge
      # Fill in the values and remove the leading # from each line you need.

      # Required:
      NETHER_PUPPET_TOKENS: "token1,token2"   # comma-separated Discord bot tokens
      NETHER_DISCORD_GUILD_ID: ""
      NETHER_DISCORD_CHANNEL_ID: ""
      NETHER_MATRIX_HOMESERVER_URL: "https://nether.im"
      NETHER_MATRIX_ROOM_ID: "!yourroomid:nether.im"
      # At least one of BOT_USER_ID or SENDER_LOCALPART is required:
      # NETHER_MATRIX_BOT_USER_ID: "@voicebridge:nether.im"   # full MXID
      NETHER_MATRIX_SENDER_LOCALPART: "voicebridge"          # derives MXID when BOT_USER_ID absent
      NETHER_MATRIX_APPSERVICE_ID: "voicebridge"
      NETHER_MATRIX_APPSERVICE_TOKEN: ""

      # Optional:
      # NETHER_MATRIX_DEVICE_ID: "ABCDEFGHIJ"   # auto-derived from the bridge name when unset
      # NETHER_PUPPET_NICKNAME_PREFIX: "[Matrix] "
      # NETHER_BRIDGE_NAME: ""                  # label used in logs + store-path leaf
      # NETHER_LIVEKIT_MEDIA_E2EE: ""           # auto-detected from room encryption; set true/false only to force
      # NETHER_LIVEKIT_KEY_TRANSPORT: ""        # auto-selected (olm for encrypted rooms); set only to force
      # NETHER_MATRIX_BOT_DISPLAY_NAME: ""
      # NETHER_MATRIX_BOT_AVATAR_PATH: ""       # path inside the container
      # NETHER_LIVEKIT_LK_JWT_URL: ""           # auto-derived; override only if needed
      # NETHER_LIVEKIT_URL: ""                  # auto-derived; override only if needed
      # NETHER_DISCORD_CAPTURE_WAV: "false"     # debug only — writes unbounded WAV files

volumes:
  voicebridge-data:
