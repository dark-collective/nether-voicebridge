# nvb-e2e harness configuration — copy to e2e.toml (gitignored) and fill in
# the secrets, or pass everything as NVB_E2E_* env vars (same names,
# uppercased with the prefix; lists are comma-separated in env form).
# Env always wins over the file. See crates/e2e/src/config.rs.
#
# The ids below are the standing test environment (#38): Discord guild
# "Nether Voice Bridge" + the Matrix "Automated Testing" space.

# Path to the bridge binary under test.
# bridge_bin = "target/debug/nether-voicebridge"

homeserver_url = "https://nether.im"
# matrix_domain = "nether.im"          # only when homeserver_url isn't the public domain
appservice_id = "voicebridge"
# Use a DISTINCT localpart stem from your production bridge (still inside the
# appservice namespace): the harness's management bot is `{stem}_bot`, and if
# that matches an MXID real users might DM, a harness run's startup
# invite-sweep can consume THEIR pending invites (#96 — this happened; the
# nether.im harness uses "nether-voicebridge_e2e" → @nether-voicebridge_e2e_bot).
sender_localpart = "nether-voicebridge_e2e"
# appservice_token = "..."             # SECRET — the bridge appservice's as_token

# Dedicated harness puppet bots for the bridge-under-test. NEVER prod's
# puppet tokens while prod is running (one token in two processes = two
# fighting voice sessions).
# puppet_tokens = ["...", "..."]       # SECRET

# Hand-created speaker bots (nvb-test-speaker-*), invited to the guild with
# Connect / Speak / Use Voice Activity.
# speaker_tokens = ["...", "..."]      # SECRET

guild_id = "1523348036040790087"
# Auto Test 01 (unencrypted; m.call.member at PL 0).
#
# One-time setup for the self-serve GATE scenario (mgmt_self_serve_link, #76):
# grant @nvbtest_mgr:<domain> power level 50 (≥ the room's state_default) and
# ensure it is joined here, so the require_room_authority positive-link path
# passes. Element → devtools → m.room.power_levels → users. Without it that
# scenario's positive-link assertion fails with a message that says so.
channel_a = "1523349282416103454"
room_a = "!iICkB3Qu8tQemzFqDl:nether.im"

# Auto Test 02 (ENCRYPTED; m.call.member at PL 0). Only the audio_*_enc
# scenarios need these — leave unset to run the unencrypted subset.
# channel_b = "..."
# room_b = "!...:nether.im"

# Auto Test 03 (a SECOND unencrypted room; m.call.member at PL 0). Needed by
# scenarios requiring a distinct-from-AT01 unencrypted target (force-move,
# multi-bridge isolation). Leave unset otherwise.
# channel_c = "1523349353014624507"
# room_c = "!cOqtiv2SAKjOK8ljxw:nether.im"

# The TEST appservice (`nvbtest` on the homeserver — separate from the
# bridge's own registration) that the fake Matrix participants (@nvbtest_*)
# masquerade under. Needed by every scenario with Matrix actors (D2+).
# test_as_token = "..."                # SECRET

# The nvb-test-mod Discord bot (Move Members + Connect) used by the DiscordMod
# REST actor to force-move / disconnect a puppet. Needed by the mod-driven
# scenarios (D3 workstream B).
# mod_token = "..."                    # SECRET

# artifacts_dir = "e2e-artifacts"
