[package]
name = "nvb-matrix-rtc"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nvb_matrix_rtc"
path = "src/lib.rs"

[features]
# #38 e2e testkit: fake Matrix call participants (speaker/phantom/listener) for
# the nvb-e2e live harness. Adds no dependencies; a default build compiles the
# module out entirely, so production is byte-identical without it.
testkit = []

[dependencies]
nvb-audio = { workspace = true }
nvb-config = { workspace = true }
serde = { workspace = true }
matrix-sdk = { workspace = true }
matrix-sdk-crypto = { workspace = true }
async-trait = { workspace = true }
livekit = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
mime = "0.3"
# Build `http::Response` from a raw reqwest response so ruma's
# `IncomingResponse::try_from_http_response` can parse the four crypto endpoints
# the send-only ghost `OlmMachine` drives by hand. "1" resolves to the same
# http 1.x ruma itself uses, so the response types match.
http = "1"

[dev-dependencies]
# `test-util` enables tokio's paused clock (`#[tokio::test(start_paused = true)]`)
# so the key-distribution retry cadence can be tested without real-time waits.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "test-util"] }
