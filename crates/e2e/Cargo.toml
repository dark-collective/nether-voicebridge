[package]
name = "nvb-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Live end-to-end regression harness for nether-voicebridge (#38 Tier 3): drives the real bridge binary against real Discord/Matrix test infrastructure."
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "nvb-e2e"
path = "src/main.rs"

# Everything here is already in the workspace dependency set — the harness adds
# no new third-party code to the tree (design rule: framework changes no bridge
# behavior, and the shipping binary never links any of this — see the workspace
# `default-members`).
[dependencies]
nvb-config = { workspace = true }
nvb-companion = { workspace = true }
nvb-audio = { workspace = true }
# The D2 fake-Matrix-participant seam. `testkit` is additive-only (a
# feature-gated module; no production code path changes), but note cargo's
# feature unification: a full-workspace build compiles nvb-matrix-rtc WITH the
# feature — the shipped binary is built `-p nether-voicebridge`, which doesn't.
nvb-matrix-rtc = { workspace = true, features = ["testkit"] }
# The #99 E2EE DM actor is a full crypto client. Same already-in-workspace
# rule as everything here — feature unification means a full-workspace build
# compiled matrix-sdk with `e2e-encryption` all along (via nvb-matrix-rtc).
matrix-sdk = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "signal"] }
tokio-util = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serenity = { workspace = true }
songbird = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
libc = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
# `test-util` enables tokio's paused clock (`#[tokio::test(start_paused = true)]`)
# so the scenario runner's inter-attempt retry backoff (#124) is virtualized in
# unit tests instead of really sleeping.
tokio = { workspace = true, features = ["test-util"] }
