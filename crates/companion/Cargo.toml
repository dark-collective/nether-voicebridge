[package]
name = "nvb-companion"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nvb_companion"
path = "src/lib.rs"

[dependencies]
nvb-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
# All already in the tree (reqwest/matrix-sdk pull them in); the companion
# listener is the binary's first HTTP server, kept to plain hyper.
sha2 = "0.10"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util", "test-util"] }
