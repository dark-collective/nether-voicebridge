[package]
name = "nvb-discord"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nvb_discord"
path = "src/lib.rs"

[dependencies]
nvb-audio = { workspace = true }
nvb-config = { workspace = true }
serenity = { workspace = true }
songbird = { workspace = true }
symphonia = { workspace = true }
hound = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
# For examples (the #46 multiguild spike): log output + a multi-thread runtime
# with Ctrl-C handling.
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
# bridge_command_fits_discord_limits: the registered definition as JSON.
serde_json = { workspace = true }
