[package]
name = "nether-voicebridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bidirectional voice bridge between Discord voice channels and Matrix (MatrixRTC / Element Call) calls."
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "nether-voicebridge"
path = "src/main.rs"

[dependencies]
nvb-config = { workspace = true }
nvb-audio = { workspace = true }
nvb-discord = { workspace = true }
nvb-matrix-rtc = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }
tokio-util = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { workspace = true }
# Raise the open-file (nofile) soft limit at startup so a crowd of per-ghost SQLite
# crypto stores can't exhaust the default 1024 FDs (see main.rs).
rlimit = "0.10"
