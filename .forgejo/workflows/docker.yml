name: Docker Build & Release

# Single compile per ref. The `image` job is the ONLY place the binary is built
# (inside the Dockerfile builder stage); the `packages` job reuses that exact
# binary by copying it out of the pushed image — no second `cargo build`.
on:
  # Releases only: the heavy image build runs on version tags, not on every push
  # to master (the single self-hosted runner is reserved for releases).
  push:
    tags: ['v*']
  # On-demand build from the Actions UI — publishes :edge for ad-hoc images
  # without cutting a release.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# CI pushes/pulls the image over tailscale (100.64.0.13:3000) to bypass the
# Cloudflare-fronted `nether.codes` path, whose chunked registry blob upload was
# failing mid-push with 502 / connection-reset. Forgejo stores the package by
# owner/image regardless of the push host, so external users still
# `docker pull nether.codes/nether/nether-voicebridge:...` (pulls go through CF
# fine — only the large push was fragile). The runner's Docker daemon must list
# this host under `insecure-registries` (it's plain HTTP on the tailnet).
#
# The image path follows the repo (`github.repository`). The repo moved from
# the `dark` user to the `nether` org; packages are stored per owner and don't
# follow a transfer, so the manifest job also copies every published tag to
# LEGACY_IMAGE, keeping existing `nether.codes/dark/nether-voicebridge` pulls
# up to date.
env:
  REGISTRY: 100.64.0.13:3000
  LEGACY_IMAGE: dark/nether-voicebridge

jobs:
  # amd64 image + static binary. Builds on the runner daemon's own BuildKit
  # (the `docker` driver, no setup-buildx container builder), so the layer
  # cache — above all the cargo-chef dependency layers, which change only with
  # Cargo.lock — persists across releases and a typical release recompiles just
  # our own crates. The daemon already lists the tailnet registry under
  # insecure-registries, so the push needs no buildkit HTTP override.
  # nvb-docker = the trusted runner registered to THIS repo only, with the
  # host's Docker socket and tailnet access (2026-10-23 runner lockdown).
  # The org-wide `docker` runner is a sandbox: no socket, public internet only.
  image:
    runs-on: nvb-docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 is built natively by the image-arm64 job below (on the
      # linux-arm64 host-mode runner) instead of QEMU-emulating it here; the
      # manifest job then merges both single-arch pushes into one multi-arch
      # tag so `docker pull .../nether-voicebridge:latest` resolves on either
      # architecture.

      - name: Use the daemon's builder (persistent layer cache)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # Auth must be the `dark` account: the image namespace `nether.codes/dark/...`
      # is a USER-owned package registry, and Forgejo only lets the owning user
      # write to it (no repo-collaborator delegation, since `dark` is a user not an
      # org). robocub authenticates but gets 401 reqPackageAccess on push.
      # REGISTRY_TOKEN is a `dark` access token (write:package) stored as a repo
      # Actions secret — value lives only in Forgejo's secret store, never here.
      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dark
          password: ${{ secrets.REGISTRY_TOKEN }}

      # What to publish, by trigger:
      #   stable tag (v1.2.3)        -> :v1.2.3 AND :latest
      #   prerelease tag (v1.2.3-rc1) -> :v1.2.3 only (don't move :latest to an rc)
      #   manual workflow_dispatch    -> :edge (ad-hoc build, not a release)
      - name: Determine image tags
        id: vars
        run: |
          repo="${REGISTRY}/${{ github.repository }}"
          {
            echo "tags<<__EOF__"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              ref="${{ github.ref_name }}"
              echo "${repo}:${ref}"
              case "$ref" in
                *-*) : ;;                      # prerelease: version tag only
                *)   echo "${repo}:latest" ;;  # stable: also move :latest
              esac
            else
              echo "${repo}:edge"              # manual dispatch
            fi
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # amd64 only in this job; linux/arm64 is built natively by
          # image-arm64 below and merged into this tag by the manifest job.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      # Fully static binary (Dockerfile `static` target; see the comments
      # there). A genuinely different binary from the image's, so it's a second
      # compile — but it shares the chef base and has its own cached dependency
      # layer, so after the first build it's our crates + the static link.
      # On workflow_dispatch it builds and self-checks only.
      - name: Build static binary
        run: |
          docker buildx build --target static --output type=local,dest=static-out .
          ls -l static-out/

      - name: Publish static binary to the (draft) Release
        if: github.ref_type == 'tag'
        env:
          API: http://${{ env.REGISTRY }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: packaging/static/package-static.sh static-out/nether-voicebridge

  # Native arm64 image + static binary on the arm64 runner (label
  # linux-arm64, also registered as ubuntu-latest). Same shape as `image`:
  # the job container (catthehacker act-24.04) drives the HOST's Docker
  # daemon, whose own BuildKit keeps the layer cache between runs, and which
  # also lists the tailnet registry under insecure-registries.
  image-arm64:
    runs-on: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the daemon's builder (persistent layer cache)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dark
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Same tag rule as the amd64 image job, arch-suffixed: this push must
      # not clobber the canonical tag before the manifest job below merges
      # both single-arch images into it.
      - name: Determine image tags
        id: vars
        run: |
          repo="${REGISTRY}/${{ github.repository }}"
          {
            echo "tags<<__EOF__"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              ref="${{ github.ref_name }}"
              echo "${repo}:${ref}-arm64"
              case "$ref" in
                *-*) : ;;                           # prerelease: version tag only
                *)   echo "${repo}:latest-arm64" ;;  # stable: also move :latest-arm64
              esac
            else
              echo "${repo}:edge-arm64"              # manual dispatch
            fi
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}

      - name: Build static binary
        run: |
          docker buildx build --target static --output type=local,dest=static-out .
          ls -l static-out/

      - name: Publish static binary to the (draft) Release
        if: github.ref_type == 'tag'
        env:
          API: http://${{ env.REGISTRY }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: packaging/static/package-static.sh static-out/nether-voicebridge

  # Merges the amd64 (`image`) and arm64 (`image-arm64`) single-arch pushes
  # into one multi-arch manifest under the canonical tag(s), so a plain
  # `docker pull .../nether-voicebridge:latest` resolves correctly regardless
  # of the pulling host's architecture. Doesn't rebuild anything — needs only
  # registry auth and both single-arch images to already exist.
  manifest:
    runs-on: nvb-docker
    needs: [image, image-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."100.64.0.13:3000"]
              http = true

      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dark
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Mirrors the tag-selection logic from the image job's "Determine image
      # tags" step — kept in sync manually (same pattern e2e.yml already uses
      # for its duplicated env blocks).
      - name: Create multi-arch manifest
        run: |
          set -eu
          repo="${REGISTRY}/${{ github.repository }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ref="${{ github.ref_name }}"
            docker buildx imagetools create -t "${repo}:${ref}" \
              "${repo}:${ref}" "${repo}:${ref}-arm64"
            case "$ref" in
              *-*) : ;;
              *) docker buildx imagetools create -t "${repo}:latest" \
                   "${repo}:latest" "${repo}:latest-arm64" ;;
            esac
          else
            docker buildx imagetools create -t "${repo}:edge" \
              "${repo}:edge" "${repo}:edge-arm64"
          fi

      # Copy the canonical tag(s) just created to the pre-transfer path, so
      # installs and docs that still say nether.codes/dark/nether-voicebridge
      # keep getting releases. Same registry: a manifest copy, no rebuild.
      # Skipped while the repo itself still lives at the legacy path.
      - name: Mirror tags to the legacy image path
        run: |
          set -eu
          if [ "${{ github.repository }}" = "${LEGACY_IMAGE}" ]; then
            echo "repo is still at ${LEGACY_IMAGE}; nothing to mirror"
            exit 0
          fi
          repo="${REGISTRY}/${{ github.repository }}"
          legacy="${REGISTRY}/${LEGACY_IMAGE}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ref="${{ github.ref_name }}"
            tags="$ref"
            case "$ref" in
              *-*) : ;;
              *) tags="$tags latest" ;;
            esac
          else
            tags="edge"
          fi
          for t in $tags; do
            docker buildx imagetools create -t "${legacy}:${t}" "${repo}:${t}"
          done

  # Builds the .deb/.rpm/tarball/AppImage for BOTH architectures, attaches them
  # to the Forgejo Release for the tag (#49), writes SHA256SUMS, and publishes
  # the release (a draft until now). Tag-only, and runs AFTER `manifest` so a
  # release is never cut with a half-published image and both arch images exist
  # to extract from. The binaries it packages are byte-identical to the ones
  # shipped in the Docker images (#29) — no second `cargo build` here (the
  # static binaries, a different build by nature, come from the image jobs).
  packages:
    runs-on: nvb-docker
    needs: [manifest]
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies (nfpm, file)
        run: |
          # nfpm (pinned), installed as a static binary. No Rust toolchain needed
          # here — the binaries come from the images, not a local compile.
          NFPM_VERSION=2.46.3
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
          # file(1): appimagetool shells out to it; zsync: zsyncmake for the
          # AppImages' self-update files (build-appimage.sh fetches the pinned
          # appimagetool + type2 runtimes itself).
          apt-get update -qq && apt-get install -y -qq --no-install-recommends file zsync

      # Auth so the pull below works regardless of package visibility (same
      # `dark` / REGISTRY_TOKEN credentials the image job pushed with).
      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dark
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Derive version from tag
        id: vars
        run: |
          # v0.2.0 -> 0.2.0 ; v0.2.1-rc1 -> 0.2.1~rc1
          # Convert the first '-' (semver pre-release separator) to '~' so dpkg/rpm
          # sort a pre-release BELOW its eventual stable release (0.2.1~rc1 < 0.2.1).
          # A plain '-rcN' is a Debian *revision* and sorts ABOVE the empty revision
          # of the bare version, which would wrongly rank the final release as a
          # downgrade. The git tag keeps '-rc' (refnames can't contain '~'); the
          # prerelease detection below still matches on the tag's hyphen.
          v="${GITHUB_REF_NAME#v}"
          echo "version=${v/-/\~}" >> "$GITHUB_OUTPUT"

      # Per arch: pull the image the build jobs just pushed, copy its
      # /app/nether-voicebridge out (this is what eliminates the second
      # `cargo build` that used to run here), then package it. `docker create`
      # never RUNS the container, so extracting from the arm64 image on this
      # amd64 runner needs no QEMU. amd64 lives under the canonical tag (pinned
      # by --platform, since `manifest` has already made it multi-arch); arm64
      # under the single-arch -arm64 tag `image-arm64` pushed. nfpm names the
      # outputs by arch (…_amd64.deb / …_arm64.deb, ….x86_64.rpm /
      # ….aarch64.rpm) so the loop iterations never collide; the tarball gets
      # the uname-style arch.
      - name: Build .deb/.rpm/tarball/AppImage for each architecture
        env:
          NVB_VERSION: ${{ steps.vars.outputs.version }}
          PUBLIC_URL: ${{ github.server_url }}
          ZSYNC_CHANNEL: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/generic/nether-voicebridge-appimage/latest
        run: |
          set -eu
          mkdir -p dist target/release
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) img="${REGISTRY}/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}" ;;
              arm64) img="${REGISTRY}/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}-arm64" ;;
            esac
            docker pull --platform "linux/${arch}" "$img"
            cid=$(docker create --platform "linux/${arch}" "$img")
            docker cp "$cid:/app/nether-voicebridge" target/release/nether-voicebridge
            docker rm "$cid"
            ls -l target/release/nether-voicebridge

            NVB_ARCH="$arch" nfpm package -f packaging/nfpm.yaml -p deb -t dist/
            NVB_ARCH="$arch" nfpm package -f packaging/nfpm.yaml -p rpm -t dist/

            # Standalone tarball for non-deb/rpm distros: the same glibc binary
            # the image carries, bundled with the example config, systemd unit,
            # license, and README so it's a self-contained drop-in.
            case "$arch" in
              amd64) uarch=x86_64 ;;
              arm64) uarch=aarch64 ;;
            esac
            stage="nether-voicebridge-${NVB_VERSION}-${uarch}-linux"
            mkdir -p "dist/${stage}"
            cp target/release/nether-voicebridge "dist/${stage}/"
            cp config.example.toml packaging/nether-voicebridge.service LICENSE README.md "dist/${stage}/"
            tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
            rm -rf "dist/${stage}"

            # AppImage: the same binary in a single self-mounting file, for
            # users who want one download they can `chmod +x` and run. It
            # embeds zsync update information pointing at a fixed per-arch
            # "channel" URL (Forgejo has no stable latest-release download
            # URL, so the channel lives in the generic package registry; see
            # the publish step), and the .zsync written next to it points back
            # at this release's AppImage. AppImageUpdate then fetches only the
            # blocks that changed between versions.
            NVB_APPIMAGE_UPDATE_INFO="zsync|${ZSYNC_CHANNEL}/nether-voicebridge-${uarch}.AppImage.zsync" \
            NVB_APPIMAGE_FILE_URL="${PUBLIC_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/nether-voicebridge-${NVB_VERSION}-${uarch}.AppImage" \
              packaging/build-appimage.sh target/release/nether-voicebridge "$uarch" "$NVB_VERSION" dist
          done
          rm -f target/release/nether-voicebridge
          ls -l dist/

      # Upload the packages to the (still draft) Release the image jobs
      # created when they attached the static binaries, then checksum every
      # asset and publish. RELEASE_TOKEN must be a Forgejo token with
      # `write:repository` scope on this repo (the Docker job's REGISTRY_TOKEN
      # is package-scoped and won't work here). The API goes over the tailnet
      # (http) instead of github.server_url so the ~40 MB uploads bypass
      # Cloudflare — the release stays reachable at the public nether.codes URL.
      - name: Publish packages, SHA256SUMS, and the Release
        env:
          API: http://${{ env.REGISTRY }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          packaging/publish-release.sh dist/*.deb dist/*.rpm dist/*.tar.gz dist/*.AppImage

          # The static tarballs were uploaded by the image jobs; fetch them
          # back by attachment UUID over the tailnet host (an asset's
          # browser_download_url is /releases/download/<tag>/<name>, which
          # has no /attachments/ part) so SHA256SUMS covers every asset. Bare
          # names → `sha256sum -c` works in a download dir.
          curl -fsS -H "Authorization: token ${TOKEN}" "${API}/releases/tags/${TAG}" \
            | python3 -c 'import sys,json
          for a in json.load(sys.stdin)["assets"]:
              if a["name"].endswith("-linux-static.tar.gz"):
                  print(a["name"], "/attachments/" + a["uuid"])' \
            | while read -r name path; do
                curl -fsSL -H "Authorization: token ${TOKEN}" -o "dist/${name}" "http://${REGISTRY}${path}"
              done
          ls dist/*-linux-static.tar.gz | wc -l | grep -qx 2 \
            || { echo "expected 2 static tarballs on the release" >&2; exit 1; }
          (cd dist && sha256sum *.deb *.rpm *.tar.gz *.AppImage > SHA256SUMS && cat SHA256SUMS)
          packaging/publish-release.sh dist/SHA256SUMS
          packaging/publish-release.sh --publish

      # Move the AppImage update channel to this release: replace the
      # per-arch .zsync under the generic package `nether-voicebridge-appimage`,
      # version `latest` (files there can't be overwritten, so delete first).
      # Stable tags only — prereleases never become what existing AppImages
      # update to. Uses the same `dark` REGISTRY_TOKEN (write:package) as the
      # image pushes, over the tailnet.
      - name: Publish the AppImage update channel
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          PKG: http://${{ env.REGISTRY }}/api/packages/${{ github.repository_owner }}/generic/nether-voicebridge-appimage/latest
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          for z in dist/*.AppImage.zsync; do
            arch=$(basename "$z" .AppImage.zsync); arch=${arch##*-}
            name="nether-voicebridge-${arch}.AppImage.zsync"
            curl -sS -o /dev/null -u "dark:${TOKEN}" -X DELETE "${PKG}/${name}" || true
            curl -fsS -u "dark:${TOKEN}" --upload-file "$z" "${PKG}/${name}"
            echo "channel: ${name} <- $(basename "$z")"
          done
