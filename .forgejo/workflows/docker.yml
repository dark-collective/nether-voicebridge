name: Docker Build & Release

# Single compile per (ref, arch). The two `image-*` jobs are the ONLY places the
# binary gets built (inside the Dockerfile builder stage), each NATIVELY on a
# runner of its own architecture — no QEMU emulation (#49). `manifest` stitches
# the per-arch images into the public multi-arch tags, and `packages` reuses the
# exact binaries by copying them out of the pushed images — no second
# `cargo build` anywhere.
on:
  # Releases only: the heavy image build runs on version tags, not on every push
  # to master (the self-hosted runners are reserved for releases).
  push:
    tags: ['v*']
  # On-demand build from the Actions UI — publishes :edge for ad-hoc images
  # without cutting a release.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# CI pushes/pulls the image over tailscale (100.64.0.13:3000) to bypass the
# Cloudflare-fronted `nether.codes` path, whose chunked registry blob upload was
# failing mid-push with 502 / connection-reset. Forgejo stores the package by
# owner/image regardless of the push host, so external users still
# `docker pull nether.codes/dark/nether-voicebridge:...` (pulls go through CF
# fine — only the large push was fragile). Every runner's Docker daemon must
# list this host under `insecure-registries` (it's plain HTTP on the tailnet),
# and every runner host must be on the tailnet — see docs/arm64-runner-setup.md
# for the arm64 runner's provisioning.
env:
  REGISTRY: 100.64.0.13:3000

jobs:
  # ── Per-arch native image builds ──────────────────────────────────────────
  # Each pushes ONE arch-suffixed tag (…:<ref>-amd64 / …:<ref>-arm64); the
  # `manifest` job below combines them into the public tags. The two jobs are
  # spelled out (not a matrix) so `runs-on` stays a literal — the amd64 runner
  # carries the `docker` label, the Oracle Ampere runner carries `docker-arm64`.
  image-amd64:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # buildkit runs in its own container and does NOT inherit the runner
          # daemon's insecure-registries, so the push to the plain-HTTP tailnet
          # registry would fail on TLS. Tell buildkit it's HTTP directly.
          buildkitd-config-inline: |
            [registry."100.64.0.13:3000"]
              http = true

      # Auth must be the `dark` account: the image namespace `nether.codes/dark/...`
      # is a USER-owned package registry, and Forgejo only lets the owning user
      # write to it (no repo-collaborator delegation, since `dark` is a user not an
      # org). robocub authenticates but gets 401 reqPackageAccess on push.
      # REGISTRY_TOKEN is a `dark` access token (write:package) stored as a repo
      # Actions secret — value lives only in Forgejo's secret store, never here.
      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dark
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Determine arch tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then ref="${{ github.ref_name }}"; else ref=edge; fi
          echo "tag=${REGISTRY}/${{ github.repository }}:${ref}-amd64" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tag }}
          # No registry buildcache: cache-to mode=max pushes the huge cargo-chef
          # dependency layer, which exceeds Cloudflare's ~100 MB upload cap (413),
          # and cache-from never resolved it anyway. Cold builds are ~12 min amd64.
          # If incremental caching is wanted later, use a non-Cloudflare backend
          # (e.g. type=gha — the runner's actions cache is enabled).

  image-arm64:
    runs-on: docker-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."100.64.0.13:3000"]
              http = true

      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dark
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Determine arch tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then ref="${{ github.ref_name }}"; else ref=edge; fi
          echo "tag=${REGISTRY}/${{ github.repository }}:${ref}-arm64" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tag }}

  # ── Multi-arch manifest ───────────────────────────────────────────────────
  # Combines the two arch images into the public tags. What gets published,
  # by trigger:
  #   stable tag (v1.2.3)         -> :v1.2.3 AND :latest
  #   prerelease tag (v1.2.3-rc1) -> :v1.2.3 only (don't move :latest to an rc)
  #   manual workflow_dispatch    -> :edge (ad-hoc build, not a release)
  manifest:
    runs-on: docker
    needs: [image-amd64, image-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # `buildx imagetools` resolves the registry client-side using the
          # current builder's registry config — without this it would insist on
          # TLS to the plain-HTTP tailnet host. (Fallback if imagetools ever
          # misbehaves here: `docker manifest create --insecure` +
          # `docker manifest push --insecure` do the same job.)
          buildkitd-config-inline: |
            [registry."100.64.0.13:3000"]
              http = true

      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dark
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Create and push the multi-arch tags
        run: |
          set -eu
          repo="${REGISTRY}/${{ github.repository }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then ref="${{ github.ref_name }}"; else ref=edge; fi
          tags="-t ${repo}:${ref}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            case "$ref" in
              *-*) : ;;                               # prerelease: version tag only
              *)   tags="$tags -t ${repo}:latest" ;;  # stable: also move :latest
            esac
          fi
          docker buildx imagetools create $tags "${repo}:${ref}-amd64" "${repo}:${ref}-arm64"
          docker buildx imagetools inspect "${repo}:${ref}"

  # ── Release packages ──────────────────────────────────────────────────────
  # Builds the .deb/.rpm/tarball for BOTH architectures and attaches them to the
  # Forgejo Release for the tag. Tag-only, and runs AFTER `manifest` so a release
  # is never cut with a half-published image. The binaries it packages are
  # byte-identical to the ones shipped in the Docker images (#29).
  packages:
    runs-on: docker
    needs: [manifest]
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies (nfpm)
        run: |
          # nfpm (pinned), installed as a static binary. No Rust toolchain needed
          # here — the binaries come from the images, not a local compile.
          NFPM_VERSION=2.46.3
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm

      # Auth so the pulls below work regardless of package visibility (same
      # `dark` / REGISTRY_TOKEN credentials the image jobs pushed with).
      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dark
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Derive version from tag
        id: vars
        run: |
          # v0.2.0 -> 0.2.0 ; v0.2.1-rc1 -> 0.2.1~rc1
          # Convert the first '-' (semver pre-release separator) to '~' so dpkg/rpm
          # sort a pre-release BELOW its eventual stable release (0.2.1~rc1 < 0.2.1).
          # A plain '-rcN' is a Debian *revision* and sorts ABOVE the empty revision
          # of the bare version, which would wrongly rank the final release as a
          # downgrade. The git tag keeps '-rc' (refnames can't contain '~'); the
          # prerelease detection below still matches on the tag's hyphen.
          v="${GITHUB_REF_NAME#v}"
          echo "version=${v/-/\~}" >> "$GITHUB_OUTPUT"

      # Per arch: pull the arch image the build jobs just pushed, copy its
      # /app/nether-voicebridge out (this is what eliminates a second
      # `cargo build`), then package it. nfpm names the outputs by arch
      # (…_amd64.deb / …_arm64.deb, ….x86_64.rpm / ….aarch64.rpm) so the loop
      # iterations never collide; the tarball gets the uname-style arch.
      - name: Build .deb/.rpm/tarball for each architecture
        env:
          NVB_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -eu
          mkdir -p dist target/release
          for arch in amd64 arm64; do
            img="${REGISTRY}/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}-${arch}"
            docker pull "$img"
            cid=$(docker create "$img")
            docker cp "$cid:/app/nether-voicebridge" target/release/nether-voicebridge
            docker rm "$cid"
            ls -l target/release/nether-voicebridge

            NVB_ARCH="$arch" nfpm package -f packaging/nfpm.yaml -p deb -t dist/
            NVB_ARCH="$arch" nfpm package -f packaging/nfpm.yaml -p rpm -t dist/

            # Standalone tarball for non-deb/rpm distros: the same glibc binary
            # the image carries, bundled with the example config, systemd unit,
            # license, and README so it's a self-contained drop-in.
            case "$arch" in
              amd64) uarch=x86_64 ;;
              arm64) uarch=aarch64 ;;
            esac
            stage="nether-voicebridge-${NVB_VERSION}-${uarch}-linux"
            mkdir -p "dist/${stage}"
            cp target/release/nether-voicebridge "dist/${stage}/"
            cp config.example.toml packaging/nether-voicebridge.service LICENSE README.md "dist/${stage}/"
            tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
            rm -rf "dist/${stage}"
          done
          ls -l dist/

      # Checksums over every release asset. Run last (after all debs/rpms +
      # tarballs exist); `cd dist` so the file lists bare names →
      # `sha256sum -c SHA256SUMS` works from inside the extracted/downloaded dir.
      - name: Generate SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Create (or reuse) the Release for this tag, then upload all packages.
      # RELEASE_TOKEN must be a Forgejo token with `write:repository` scope on this
      # repo (the Docker job's REGISTRY_TOKEN is package-scoped and won't work here).
      - name: Publish packages to the Forgejo Release
        env:
          # Use the tailnet API endpoint (http) instead of github.server_url so the
          # ~38 MB asset uploads bypass Cloudflare too — the release object is the
          # same and stays reachable at the public nether.codes URL.
          API: http://${{ env.REGISTRY }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          auth="Authorization: token ${TOKEN}"

          # Semver: any tag with a hyphen pre-release identifier (e.g. v0.2.0-rc5,
          # -beta, -alpha) is a pre-release; a bare v0.2.0 is a stable release.
          case "${TAG}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          # Look up an existing release for the tag; create one if absent.
          rel_id=$(curl -fsSL -H "$auth" "${API}/releases/tags/${TAG}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' || true)
          if [ -z "$rel_id" ]; then
            rel_id=$(curl -fsSL -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":${prerelease}}" \
              "${API}/releases" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          else
            # Reuse path: correct a pre-existing release's flag to match the tag
            # (e.g. one pre-created in the UI), so the rule holds either way.
            curl -fsSL -X PATCH -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"prerelease\":${prerelease}}" \
              "${API}/releases/${rel_id}" >/dev/null
          fi
          echo "release id: $rel_id"

          for f in dist/*.deb dist/*.rpm dist/*.tar.gz dist/SHA256SUMS; do
            name=$(basename "$f")
            echo "uploading $name"
            curl -fsSL -X POST -H "$auth" \
              -F "attachment=@${f}" \
              "${API}/releases/${rel_id}/assets?name=${name}" >/dev/null
          done
