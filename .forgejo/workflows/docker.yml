name: Docker Build & Release

# Single compile per ref. The `image` job is the ONLY place the binary is built
# (inside the Dockerfile builder stage); the `packages` job reuses that exact
# binary by copying it out of the pushed image — no second `cargo build`.
on:
  # Releases only: the heavy image build runs on version tags, not on every push
  # to master (the single self-hosted runner is reserved for releases).
  push:
    tags: ['v*']
  # On-demand build from the Actions UI — publishes :edge for ad-hoc images
  # without cutting a release.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# CI pushes/pulls the image over tailscale (100.64.0.13:3000) to bypass the
# Cloudflare-fronted `nether.codes` path, whose chunked registry blob upload was
# failing mid-push with 502 / connection-reset. Forgejo stores the package by
# owner/image regardless of the push host, so external users still
# `docker pull nether.codes/dark/nether-voicebridge:...` (pulls go through CF
# fine — only the large push was fragile). The runner's Docker daemon must list
# this host under `insecure-registries` (it's plain HTTP on the tailnet).
env:
  REGISTRY: 100.64.0.13:3000

jobs:
  image:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 is disabled for now (emulated build is very slow). To restore
      # multi-arch: uncomment this step and add linux/arm64 to `platforms` below.
      # - name: Set up QEMU (for arm64 cross-build)
      #   uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # buildkit runs in its own container and does NOT inherit the runner
          # daemon's insecure-registries, so the push to the plain-HTTP tailnet
          # registry would fail on TLS. Tell buildkit it's HTTP directly.
          buildkitd-config-inline: |
            [registry."100.64.0.13:3000"]
              http = true

      # Auth must be the `dark` account: the image namespace `nether.codes/dark/...`
      # is a USER-owned package registry, and Forgejo only lets the owning user
      # write to it (no repo-collaborator delegation, since `dark` is a user not an
      # org). robocub authenticates but gets 401 reqPackageAccess on push.
      # REGISTRY_TOKEN is a `dark` access token (write:package) stored as a repo
      # Actions secret — value lives only in Forgejo's secret store, never here.
      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dark
          password: ${{ secrets.REGISTRY_TOKEN }}

      # What to publish, by trigger:
      #   stable tag (v1.2.3)        -> :v1.2.3 AND :latest
      #   prerelease tag (v1.2.3-rc1) -> :v1.2.3 only (don't move :latest to an rc)
      #   manual workflow_dispatch    -> :edge (ad-hoc build, not a release)
      - name: Determine image tags
        id: vars
        run: |
          repo="${REGISTRY}/${{ github.repository }}"
          {
            echo "tags<<__EOF__"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              ref="${{ github.ref_name }}"
              echo "${repo}:${ref}"
              case "$ref" in
                *-*) : ;;                      # prerelease: version tag only
                *)   echo "${repo}:latest" ;;  # stable: also move :latest
              esac
            else
              echo "${repo}:edge"              # manual dispatch
            fi
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # amd64-only for now (see the commented QEMU step above to restore
          # multi-arch: `platforms: linux/amd64,linux/arm64`).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          # No registry buildcache: cache-to mode=max pushes the huge cargo-chef
          # dependency layer, which exceeds Cloudflare's ~100 MB upload cap (413),
          # and cache-from never resolved it anyway. Cold builds are ~12 min amd64.
          # If incremental caching is wanted later, use a non-Cloudflare backend
          # (e.g. type=gha — the runner's actions cache is enabled).

  # Builds the .deb and .rpm and attaches them to the Forgejo Release for the tag.
  # Tag-only, and runs AFTER `image` so it can reuse that build's binary instead
  # of compiling a second time (#29). The binary it packages is byte-identical to
  # the one shipped in the Docker image.
  packages:
    runs-on: docker
    needs: [image]
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies (nfpm)
        run: |
          # nfpm (pinned), installed as a static binary. No Rust toolchain needed
          # here — the binary comes from the image, not a local compile.
          NFPM_VERSION=2.46.3
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm

      # Auth so the pull below works regardless of package visibility (same
      # `dark` / REGISTRY_TOKEN credentials the image job pushed with).
      - name: Log in to the Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dark
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Derive version from tag
        id: vars
        run: |
          # v0.2.0 -> 0.2.0 ; v0.2.1-rc1 -> 0.2.1~rc1
          # Convert the first '-' (semver pre-release separator) to '~' so dpkg/rpm
          # sort a pre-release BELOW its eventual stable release (0.2.1~rc1 < 0.2.1).
          # A plain '-rcN' is a Debian *revision* and sorts ABOVE the empty revision
          # of the bare version, which would wrongly rank the final release as a
          # downgrade. The git tag keeps '-rc' (refnames can't contain '~'); the
          # prerelease detection below still matches on the tag's hyphen.
          v="${GITHUB_REF_NAME#v}"
          echo "version=${v/-/\~}" >> "$GITHUB_OUTPUT"

      # Reuse the binary the `image` job already compiled: pull the pushed image
      # and copy /app/nether-voicebridge out to the path nfpm.yaml expects
      # (target/release/nether-voicebridge). This is what eliminates the second
      # `cargo build` that used to run here.
      - name: Extract release binary from the pushed image
        run: |
          set -eu
          img="${REGISTRY}/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          docker pull "$img"
          cid=$(docker create "$img")
          mkdir -p target/release
          docker cp "$cid:/app/nether-voicebridge" target/release/nether-voicebridge
          docker rm "$cid"
          ls -l target/release/nether-voicebridge

      - name: Build .deb and .rpm
        env:
          NVB_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          ls -l dist/

      # Standalone tarball for non-deb/rpm distros: the same glibc/amd64 binary
      # the image carries, bundled with the example config, systemd unit, license,
      # and README so it's a self-contained drop-in. No recompile — reuses the
      # binary extracted above.
      - name: Build the standalone x86_64 tarball
        env:
          NVB_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -eu
          stage="nether-voicebridge-${NVB_VERSION}-x86_64-linux"
          mkdir -p "dist/${stage}"
          cp target/release/nether-voicebridge "dist/${stage}/"
          cp config.example.toml packaging/nether-voicebridge.service LICENSE README.md "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          rm -rf "dist/${stage}"
          ls -l dist/

      # Checksums over every release asset. Run last (after deb/rpm + tarball
      # exist); `cd dist` so the file lists bare names → `sha256sum -c SHA256SUMS`
      # works from inside the extracted/downloaded dir.
      - name: Generate SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Create (or reuse) the Release for this tag, then upload both packages.
      # RELEASE_TOKEN must be a Forgejo token with `write:repository` scope on this
      # repo (the Docker job's REGISTRY_TOKEN is package-scoped and won't work here).
      - name: Publish packages to the Forgejo Release
        env:
          # Use the tailnet API endpoint (http) instead of github.server_url so the
          # ~38 MB asset uploads bypass Cloudflare too — the release object is the
          # same and stays reachable at the public nether.codes URL.
          API: http://${{ env.REGISTRY }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          auth="Authorization: token ${TOKEN}"

          # Semver: any tag with a hyphen pre-release identifier (e.g. v0.2.0-rc5,
          # -beta, -alpha) is a pre-release; a bare v0.2.0 is a stable release.
          case "${TAG}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          # Look up an existing release for the tag; create one if absent.
          rel_id=$(curl -fsSL -H "$auth" "${API}/releases/tags/${TAG}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' || true)
          if [ -z "$rel_id" ]; then
            rel_id=$(curl -fsSL -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":${prerelease}}" \
              "${API}/releases" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          else
            # Reuse path: correct a pre-existing release's flag to match the tag
            # (e.g. one pre-created in the UI), so the rule holds either way.
            curl -fsSL -X PATCH -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"prerelease\":${prerelease}}" \
              "${API}/releases/${rel_id}" >/dev/null
          fi
          echo "release id: $rel_id"

          for f in dist/*.deb dist/*.rpm dist/*.tar.gz dist/SHA256SUMS; do
            name=$(basename "$f")
            echo "uploading $name"
            curl -fsSL -X POST -H "$auth" \
              -F "attachment=@${f}" \
              "${API}/releases/${rel_id}/assets?name=${name}" >/dev/null
          done
