name: E2E (live)

# Tier-3 LIVE regression harness (#38 Phase D). Runs the real bridge binary
# against the standing Discord guild + Matrix rooms with dedicated harness bots.
# NOT a per-PR gate: external services (Discord/Matrix/LiveKit) make it
# inherently flaky, so a red run is a triage ticket, never a merge block — the
# per-PR hermetic gate is ci.yml. Public ids are inlined (they're already in
# the committed e2e.example.toml); only the bot/appservice tokens are secrets.
#
# NOTE: Forgejo pins the nightly schedule to the commit_sha of the last
# default-branch push that touched THIS file — a source-only merge does NOT
# refresh it. After merging a fix the nightly must pick up, bump this file
# (a comment edit suffices) so the schedule re-registers on current master.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'space-separated scenario names, or "--all"'
        required: false
        default: 'smoke_open_close'
      profile:
        description: 'compressed | real'
        required: false
        default: 'compressed'
  schedule:
    # Nightly full compressed suite. 08:30 UTC ON PURPOSE: the runner host's
    # apt-daily-upgrade.timer fires ~06:00-07:00 UTC and its dpkg/IO load
    # garbles the audio-oracle scenarios — every 06:00 nightly from 07-11 to
    # 07-14 was red from exactly this while manually-dispatched runs passed
    # (post-mortem: issue #123). 08:30 clears that window and mautrix's 04:15
    # nvb-backup.
    - cron: '30 8 * * *'
  # Fast pre-merge evidence (#107): every CODE push to a feature/fix branch
  # runs the management subset (~5 min, no audio, load-insensitive) against
  # the live environment — the checks we used to dispatch by hand before every
  # merge request. Docs-only diffs skip via the paths filter; audio scenarios
  # stay nightly-only (host-load sensitivity). The shared `live-host`
  # concurrency group below serializes these with nightlies and CI builds.
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
      - 'e2e/**'
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.forgejo/workflows/e2e.yml'

# One live run at a time, AND never alongside a CI build. The harness and CI share
# a physical host, and overlapping CPU-heavy work garbles the audio timing scores
# (#38 note). The `live-host` group is shared with ci.yml so Forgejo serializes
# {any CI run, this harness} to one at a time; cancel-in-progress stays false so a
# queued CI push waits for the harness rather than cancelling it.
concurrency:
  group: live-host
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same native deps as ci.yml (livekit: cmake/clang/bindgen + protobuf;
      # opus dynamically linked).
      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev libopus-dev \
            pkg-config protobuf-compiler libssl-dev

      # Share ci.yml's cache key so target/ (incl. the libwebrtc download and an
      # already-compiled bridge) is warm.
      - name: Cache toolchain + cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-

      - name: Install Rust toolchain
        run: |
          if ! [ -x "$HOME/.cargo/bin/cargo" ]; then
            curl -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build bridge + harness
        run: cargo build --locked -p nether-voicebridge -p nvb-e2e

      - name: Run scenarios
        env:
          # Public standing-environment ids (also in e2e.example.toml).
          NVB_E2E_HOMESERVER_URL: https://nether.im
          NVB_E2E_APPSERVICE_ID: voicebridge
          NVB_E2E_SENDER_LOCALPART: nether-voicebridge_e2e
          NVB_E2E_GUILD_ID: '1523348036040790087'
          NVB_E2E_CHANNEL_A: '1523349282416103454'
          NVB_E2E_ROOM_A: '!iICkB3Qu8tQemzFqDl:nether.im'
          NVB_E2E_CHANNEL_B: '1523349327223853077'
          NVB_E2E_ROOM_B: '!qeb6ZoxkuXOMVhdmDZ:nether.im'
          NVB_E2E_CHANNEL_C: '1523349353014624507'
          NVB_E2E_ROOM_C: '!cOqtiv2SAKjOK8ljxw:nether.im'
          # #109 federation fixture (nether.autos). The url is public; only the
          # autotest as_token is secret. A missing secret would make the fed_*
          # group PARTIAL (a loud config error), so the run step drops the url
          # when the token is empty — the fed_* scenarios then skip cleanly.
          NVB_E2E_FED_HOMESERVER_URL: https://nether.autos
          NVB_E2E_FED_AS_TOKEN: ${{ secrets.NVB_E2E_FED_AS_TOKEN }}
          # Secrets (bot + appservice tokens). List secrets are comma-separated.
          NVB_E2E_APPSERVICE_TOKEN: ${{ secrets.NVB_E2E_APPSERVICE_TOKEN }}
          NVB_E2E_TEST_AS_TOKEN: ${{ secrets.NVB_E2E_TEST_AS_TOKEN }}
          NVB_E2E_MOD_TOKEN: ${{ secrets.NVB_E2E_MOD_TOKEN }}
          NVB_E2E_SPEAKER_TOKENS: ${{ secrets.NVB_E2E_SPEAKER_TOKENS }}
          NVB_E2E_PUPPET_TOKENS: ${{ secrets.NVB_E2E_PUPPET_TOKENS }}
          NVB_E2E_BRIDGE_BIN: target/debug/nether-voicebridge
          NVB_E2E_ARTIFACTS: e2e-artifacts
          RUST_LOG: nvb_e2e=info,nvb_matrix_rtc=warn,songbird=debug
        run: |
          set -euo pipefail
          # No fixture as_token (e.g. a fork without the secret) → drop the url
          # too, so the fed_* group resolves to "absent" (skip) not "partial"
          # (config error).
          if [ -z "${NVB_E2E_FED_AS_TOKEN:-}" ]; then
            unset NVB_E2E_FED_HOMESERVER_URL NVB_E2E_FED_AS_TOKEN
          fi
          # workflow_dispatch supplies inputs; the nightly `schedule` event has
          # none, so it defaults to the full compressed suite. long_glitch_sweep
          # stays opt-in (gated behind NVB_E2E_LONG) so `--all` skips it. A
          # branch `push` (#107) runs the fast management subset — the
          # pre-merge evidence that used to be a by-hand dispatch convention.
          SC="${{ inputs.scenarios }}"
          if [ -z "$SC" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              SC="--all"
            elif [ "${{ github.event_name }}" = "push" ]; then
              SC="mgmt_self_serve_link room_misconfig_notice mgmt_invite_offline mgmt_dm_e2ee"
            else
              SC="smoke_open_close"
            fi
          fi
          PROF="${{ inputs.profile }}"
          PROF="${PROF:-compressed}"
          if [ "$SC" = "--all" ]; then
            target/debug/nvb-e2e run --all --profile "$PROF"
          else
            args=""
            for s in $SC; do args="$args --scenario $s"; done
            # shellcheck disable=SC2086
            target/debug/nvb-e2e run $args --profile "$PROF"
          fi

      # Real-timing subset (#8 reap_release + #13 leave_grace_debounce): runs on
      # the REAL profile (45s reap / 12s leave grace), so it stays out of the
      # compressed `--all` pass above (which no-ops them). Nightly-only — these
      # add ~2-3 min of production-timed waiting. Only runs if the compressed
      # pass above succeeded (`--all` bails non-zero on a Pass-expected failure).
      - name: Run real-timing subset (nightly)
        if: github.event_name == 'schedule'
        env:
          # Public standing-environment ids (also in e2e.example.toml).
          NVB_E2E_HOMESERVER_URL: https://nether.im
          NVB_E2E_APPSERVICE_ID: voicebridge
          NVB_E2E_SENDER_LOCALPART: nether-voicebridge_e2e
          NVB_E2E_GUILD_ID: '1523348036040790087'
          NVB_E2E_CHANNEL_A: '1523349282416103454'
          NVB_E2E_ROOM_A: '!iICkB3Qu8tQemzFqDl:nether.im'
          NVB_E2E_CHANNEL_B: '1523349327223853077'
          NVB_E2E_ROOM_B: '!qeb6ZoxkuXOMVhdmDZ:nether.im'
          NVB_E2E_CHANNEL_C: '1523349353014624507'
          NVB_E2E_ROOM_C: '!cOqtiv2SAKjOK8ljxw:nether.im'
          NVB_E2E_APPSERVICE_TOKEN: ${{ secrets.NVB_E2E_APPSERVICE_TOKEN }}
          NVB_E2E_TEST_AS_TOKEN: ${{ secrets.NVB_E2E_TEST_AS_TOKEN }}
          NVB_E2E_MOD_TOKEN: ${{ secrets.NVB_E2E_MOD_TOKEN }}
          NVB_E2E_SPEAKER_TOKENS: ${{ secrets.NVB_E2E_SPEAKER_TOKENS }}
          NVB_E2E_PUPPET_TOKENS: ${{ secrets.NVB_E2E_PUPPET_TOKENS }}
          NVB_E2E_BRIDGE_BIN: target/debug/nether-voicebridge
          # Separate dir so this pass's report.json doesn't clobber the
          # compressed suite's (both are dumped by the summarize step).
          NVB_E2E_ARTIFACTS: e2e-artifacts-real
          RUST_LOG: nvb_e2e=info,nvb_matrix_rtc=warn,songbird=debug
        run: |
          set -euo pipefail
          target/debug/nvb-e2e run \
            --scenario reap_release --scenario leave_grace_debounce \
            --profile real

      # Triage record. The job log is the ALWAYS-available record: this Forgejo's
      # act_runner does not support the upload-artifact@v4 service protocol, so we
      # dump report.json (+ any bridge ERROR lines) straight into the log. The
      # artifact upload is a best-effort convenience (continue-on-error so a
      # missing/older artifact backend never reds an otherwise-green run).
      - name: Summarize result
        if: always()
        run: |
          for dir in e2e-artifacts e2e-artifacts-real; do
            [ -d "$dir" ] || continue
            echo "===== $dir/report.json ====="
            cat "$dir/report.json" 2>/dev/null || echo '(no report.json — harness bailed before running scenarios)'
            echo "===== $dir bridge ERROR lines (if any) ====="
            grep -rhE '"level":"ERROR"' "$dir"/*/bridge/bridge.log 2>/dev/null | head -20 || true
          done
      - name: Upload artifacts (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/
            e2e-artifacts-real/
          if-no-files-found: warn
