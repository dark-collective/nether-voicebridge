name: Release Packages

# Builds the .deb and .rpm and attaches them to the Forgejo Release for the tag.
# Runs alongside docker.yml (which builds the image) on the same `v*` tag push.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  packages:
    runs-on: docker
    # Same toolchain base as the Dockerfile builder stage.
    container:
      image: rust:1-bookworm
    steps:
      - name: Install build + packaging dependencies
        run: |
          apt-get update
          # Native build deps (mirror the Dockerfile): livekit needs cmake/clang/
          # protobuf, songbird/opus needs libopus-dev, plus pkg-config + openssl
          # headers for transitive crates.
          apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev libopus-dev \
            pkg-config protobuf-compiler libssl-dev ca-certificates curl git
          # nfpm (pinned), installed as a static binary.
          NFPM_VERSION=2.46.3
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm

      # Plain git clone instead of actions/checkout@v4: that action is a Node.js
      # action, but this job runs in `container: rust:1-bookworm`, which has no
      # Node — so the JS action can't exec ("node: not found") and the job died at
      # checkout. With no JS actions in the job, the Node-less container is fine.
      # Repo is public, so no auth is needed; --branch accepts the tag ref.
      - name: Checkout (plain git — avoids Node-in-container requirement)
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .

      - name: Derive version from tag
        id: vars
        run: |
          # v0.2.0 -> 0.2.0
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked -p nether-voicebridge

      - name: Build .deb and .rpm
        env:
          NVB_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          ls -l dist/

      # Create (or reuse) the Release for this tag, then upload both packages.
      # RELEASE_TOKEN must be a Forgejo token with `write:repository` scope on this
      # repo (the Docker job's REGISTRY_TOKEN is package-scoped and won't work here).
      - name: Publish packages to the Forgejo Release
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          auth="Authorization: token ${TOKEN}"

          # Semver: any tag with a hyphen pre-release identifier (e.g. v0.2.0-rc5,
          # -beta, -alpha) is a pre-release; a bare v0.2.0 is a stable release.
          case "${TAG}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          # Look up an existing release for the tag; create one if absent.
          rel_id=$(curl -fsSL -H "$auth" "${API}/releases/tags/${TAG}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' || true)
          if [ -z "$rel_id" ]; then
            rel_id=$(curl -fsSL -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":${prerelease}}" \
              "${API}/releases" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          else
            # Reuse path: correct a pre-existing release's flag to match the tag
            # (e.g. one pre-created in the UI), so the rule holds either way.
            curl -fsSL -X PATCH -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"prerelease\":${prerelease}}" \
              "${API}/releases/${rel_id}" >/dev/null
          fi
          echo "release id: $rel_id"

          for f in dist/*.deb dist/*.rpm; do
            name=$(basename "$f")
            echo "uploading $name"
            curl -fsSL -X POST -H "$auth" \
              -F "attachment=@${f}" \
              "${API}/releases/${rel_id}/assets?name=${name}" >/dev/null
          done
